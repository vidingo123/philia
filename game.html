<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Coração</title>

<style>

html,
body{

  margin:0;
  padding:0;

  width:100vw;
  height:100vh;

  overflow:hidden;

  background:black;
}

.game-body{

  width:100vw;
  height:100vh;

  overflow:hidden;

  position:relative;
}

#heart{

  position:absolute;

  width:70px;
  height:70px;

  left:100px;
  top:100px;

  font-size:70px;

  color:red;

  display:flex;
  justify-content:center;
  align-items:center;
}

#timer{

  position:absolute;

  top:30px;
  left:50%;

  transform:translateX(-50%);

  color:white;

  font-size:40px;
}

#backLink{

  position:absolute;

  top:50%;
  left:50%;

  transform:translate(-50%, -50%);

  color:white;

  font-size:35px;

  text-decoration:none;

  display:none;
}

</style>

</head>

<body class="game-body">

<div id="timer">0</div>

<div id="heart">❤️</div>

<a href="index.html" id="backLink">
Voltar
</a>

<script>

const heart =
document.getElementById("heart");

const timer =
document.getElementById("timer");

const backLink =
document.getElementById("backLink");

/* ID */

const params =
new URLSearchParams(window.location.search);

const heartId =
params.get("heart");

/* POSIÇÃO */

let x = 100;
let y = 100;

let speed = 5;

/* DIFICULDADE */

if(heartId == 2){

  speed = 8;

}

if(heartId == 3){

  speed = 11;

}

let vx = speed;
let vy = speed;

let moving = true;

/* MOVIMENTO */

function animate(){

  if(moving){

    x += vx;
    y += vy;

    const maxX =
      window.innerWidth - 70;

    const maxY =
      window.innerHeight - 70;

    if(x <= 0 || x >= maxX){

      vx *= -1;

    }

    if(y <= 0 || y >= maxY){

      vy *= -1;

    }

    heart.style.left = x + "px";

    heart.style.top = y + "px";
  }

  requestAnimationFrame(animate);
}

animate();

/* TIMER */

let seconds = 0;

let interval;

/* SEGURAR */

function startHold(e){

  e.preventDefault();

  moving = false;

  seconds = 0;

  timer.innerHTML = "0";

  interval = setInterval(() => {

    seconds++;

    timer.innerHTML = seconds;

    if(seconds >= 5){

      clearInterval(interval);

      sessionStorage.setItem(
        "heart" + heartId,
        "true"
      );

      heart.style.display = "none";

      timer.style.display = "none";

      backLink.style.display = "block";
    }

  }, 1000);
}

/* SOLTAR */

function stopHold(){

  if(seconds < 5){

    clearInterval(interval);

    moving = true;

    timer.innerHTML = "0";
  }
}

/* EVENTOS */

heart.addEventListener(
  "touchstart",
  startHold
);

heart.addEventListener(
  "touchend",
  stopHold
);

heart.addEventListener(
  "mousedown",
  startHold
);

heart.addEventListener(
  "mouseup",
  stopHold
);

</script>

</body>
</html>
