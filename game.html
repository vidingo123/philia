<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coração</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body class="game-body">

  <div id="timer">0</div>
  <div id="heart">❤️</div>

  <a href="index.html" id="backLink" style="display:none;">Voltar</a>

  <script>
    document.addEventListener("DOMContentLoaded", () => {

      const heart = document.getElementById("heart");
      const timerText = document.getElementById("timer");
      const backLink = document.getElementById("backLink");

      const urlParams = new URLSearchParams(window.location.search);
      const heartId = urlParams.get("heart");

      let x = 100;
      let y = 100;
      let speedX = 7;
      let speedY = 7;
      let moving = true;

      let seconds = 0;
      let interval = null;

      /* 🔥 GARANTIA: elemento existe */
      if (!heart) {
        console.error("Heart não encontrado no DOM!");
        return;
      }

      function animate() {
        if (moving) {
          x += speedX;
          y += speedY;

          const w = window.innerWidth;
          const h = window.innerHeight;
          const size = heart.offsetWidth;

          if (x <= 0 || x + size >= w) speedX *= -1;
          if (y <= 0 || y + size >= h) speedY *= -1;

          heart.style.left = x + "px";
          heart.style.top = y + "px";
        }

        requestAnimationFrame(animate);
      }

      animate();

      function startHold(e) {
        e.preventDefault();

        moving = false;
        seconds = 0;
        timerText.innerHTML = "0";

        clearInterval(interval);

        interval = setInterval(() => {
          seconds++;
          timerText.innerHTML = seconds;

          if (seconds >= 5) {
            clearInterval(interval);

            if (heartId) {
              localStorage.setItem("heart_" + heartId, "true");
            }

            heart.style.display = "none";
            timerText.style.display = "none";
            backLink.style.display = "block";
          }
        }, 1000);
      }

      function stopHold() {
        if (seconds < 5) {
          clearInterval(interval);
          moving = true;
          timerText.innerHTML = "0";
        }
      }

      /* 🔥 eventos mais estáveis */
      heart.addEventListener("pointerdown", startHold);
      heart.addEventListener("pointerup", stopHold);
      heart.addEventListener("pointercancel", stopHold);
    });
  </script>

</body>
</html>
