    let vy = 8;

    let moving = true;

function animate(){

  if(moving){

    const rect =
      heart.getBoundingClientRect();

    const heartWidth =
      rect.width;

    const heartHeight =
      rect.height;

    const maxX =
      document.documentElement.clientWidth
      - heartWidth;

    const maxY =
      document.documentElement.clientHeight
      - heartHeight;

    x += vx;
    y += vy;

    /* COLISÃO */

    if(x <= 0){

      x = 0;
      vx *= -1;

    }

    if(x >= maxX){

      x = maxX;
      vx *= -1;

    }

    if(y <= 0){

      y = 0;
      vy *= -1;

    }

    if(y >= maxY){

      y = maxY;
      vy *= -1;

    }

    heart.style.top = y + "px";
