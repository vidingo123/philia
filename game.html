<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coração</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body class="game-body">

  <div id="timer">0</div>
  <div id="heart">❤️</div>

  <a href="index.html" id="backLink">Voltar</a>

  <script>
    document.addEventListener("DOMContentLoaded", () => {

      const heart = document.getElementById("heart");
      const timer = document.getElementById("timer");
      const backLink = document.getElementById("backLink");

      const params = new URLSearchParams(window.location.search);
      const heartId = params.get("heart");

      let x = 100;
      let y = 100;
      let vx = 6;
      let vy = 6;

      let moving = true;
      let seconds = 0;
      let interval = null;

      /* animação */
      function loop(){
        if(moving){
          x += vx;
          y += vy;

          const w = window.innerWidth;
          const h = window.innerHeight;
          const size = heart.offsetWidth;

          if(x <= 0 || x + size >= w) vx *= -1;
          if(y <= 0 || y + size >= h) vy *= -1;

          heart.style.left = x + "px";
          heart.style.top = y + "px";
        }

        requestAnimationFrame(loop);
      }

      loop();

      /* SEGURAR (MOBILE FIX COMPLETO) */
      function start(e){
        e.preventDefault();

        moving = false;
        seconds = 0;
        timer.innerText = "0";

        clearInterval(interval);

        interval = setInterval(() => {
          seconds++;
          timer.innerText = seconds;

          if(seconds >= 5){

            clearInterval(interval);

            if(heartId){
              sessionStorage.setItem(
  "heart_" + heartId,
  "true"
);
            }

            heart.style.display = "none";
            timer.style.display = "none";
            backLink.style.display = "block";
          }

        }, 1000);
      }

      function stop(){
        if(seconds < 5){
          clearInterval(interval);
          moving = true;
          timer.innerText = "0";
        }
      }

      /* MOBILE + DESKTOP 100% COMPATÍVEL */
      heart.addEventListener("touchstart", start, { passive:false });
      heart.addEventListener("touchend", stop);
      heart.addEventListener("touchcancel", stop);

      heart.addEventListener("mousedown", start);
      heart.addEventListener("mouseup", stop);

    });
  </script>

</body>
</html>
