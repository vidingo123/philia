<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Coração</title>

  <link rel="stylesheet" href="css/style.css">
</head>
<body class="game-body">

  <div id="timer">0</div>

  <div id="heart">❤️</div>

  <a href="index.html"
     id="backLink"
     style="display:none;">

     Voltar

  </a>

  <script>

    const heart =
      document.getElementById("heart");

    const timer =
      document.getElementById("timer");

    const backLink =
      document.getElementById("backLink");

    /* ID */

    const params =
      new URLSearchParams(window.location.search);

    const heartId =
      params.get("heart");

    /* MOVIMENTO */

    let x = 100;
    let y = 100;

    let vx = 8;
    let vy = 8;

    let moving = true;

    function animate(){

      if(moving){

        x += vx;
        y += vy;

        const w = window.innerWidth;
        const h = window.innerHeight;

        const heartWidth = heart.offsetWidth;
const heartHeight = heart.offsetHeight;

/* LADOS */

if(x <= 0 || x + heartWidth >= w){
  vx *= -1;
}

/* TOPO E BAIXO */

if(y <= 0 || y + heartHeight >= h){
  vy *= -1;
}

        heart.style.left = x + "px";
        heart.style.top = y + "px";
      }

      requestAnimationFrame(animate);
    }

    animate();

    /* SEGURAR */

    let seconds = 0;

    let interval;

    function start(){

      moving = false;

      seconds = 0;

      interval = setInterval(() => {

        seconds++;

        timer.innerHTML = seconds;

        if(seconds >= 5){

          clearInterval(interval);

          /* SALVAR */

          sessionStorage.setItem(
            "heart" + heartId,
            "true"
          );

          /* ESCONDER */

          heart.style.display = "none";

          timer.style.display = "none";

          backLink.style.display = "block";
        }

      }, 1000);
    }

    function stop(){

      if(seconds < 5){

        clearInterval(interval);

        moving = true;

        timer.innerHTML = "0";
      }
    }

    heart.addEventListener(
      "mousedown",
      start
    );

    heart.addEventListener(
      "mouseup",
      stop
    );

    heart.addEventListener(
      "touchstart",
      start
    );

    heart.addEventListener(
      "touchend",
      stop
    );

  </script>

</body>
</html>
