<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <style>

html,
body{

  margin:0;
  padding:0;

  width:100vw;
  height:100vh;

  overflow:hidden;

  background:black;
}

.game-body{

  width:100vw;
  height:100vh;

  overflow:hidden;

  position:relative;
}

#heart{

  position:absolute;

  font-size:70px;

  left:100px;
  top:100px;

  color:red;

  z-index:10;
}

#timer{

  position:absolute;

  top:30px;
  left:50%;

  transform:translateX(-50%);

  color:white;

  font-size:40px;
}

#backLink{

  position:absolute;

  top:50%;
  left:50%;

  transform:translate(-50%, -50%);

  color:white;

  font-size:35px;

  display:none;
}

  </style>

  <title>Coração</title>

  <link rel="stylesheet" href="css/style.css">
</head>
<body class="game-body">

  <div id="timer">0</div>

  <div id="heart">❤️</div>

  <a href="index.html"
     id="backLink"
     style="display:none;">

     Voltar

  </a>

<script>

const heart =
  document.getElementById("heart");

const timer =
  document.getElementById("timer");

const backLink =
  document.getElementById("backLink");

/* ID */

const params =
  new URLSearchParams(window.location.search);

const heartId =
  params.get("heart");

/* POSIÇÃO */

let x = 100;
let y = 100;

let vx = 6;
let vy = 6;

let moving = true;

/* MOVIMENTO */

function animate(){

  if(moving){

    const width =
      window.innerWidth;

    const height =
      window.innerHeight;

    const size = 70;

    x += vx;
    y += vy;

    /* BORDAS */

    if(x <= 0){

      x = 0;
      vx *= -1;

    }

    if(x >= width - size){

      x = width - size;
      vx *= -1;

    }

    if(y <= 0){

      y = 0;
      vy *= -1;

    }

    if(y >= height - size){

      y = height - size;
      vy *= -1;

    }

    heart.style.left = x + "px";
    heart.style.top = y + "px";
  }

  requestAnimationFrame(animate);
}

animate();

/* TIMER */

let seconds = 0;

let interval;

/* SEGURAR */

function startHold(e){

  e.preventDefault();

  moving = false;

  seconds = 0;

  timer.innerHTML = "0";

  interval = setInterval(() => {

    seconds++;

    timer.innerHTML = seconds;

    if(seconds >= 5){

      clearInterval(interval);

      sessionStorage.setItem(
        "heart" + heartId,
        "true"
      );

      heart.style.display = "none";

      timer.style.display = "none";

      backLink.style.display = "block";
    }

  }, 1000);
}

/* SOLTAR */

function stopHold(){

  if(seconds < 5){

    clearInterval(interval);

    moving = true;

    timer.innerHTML = "0";
  }
}

/* MOBILE */

heart.addEventListener(
  "touchstart",
  startHold
);

heart.addEventListener(
  "touchend",
  stopHold
);

/* PC */

heart.addEventListener(
  "mousedown",
  startHold
);

heart.addEventListener(
  "mouseup",
  stopHold
);

</script>

</body>
</html>
