<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memórias</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="timeline">

    <a href="game.html?heart=1" class="photo" id="photo1">
      <img src="img/20260328_101205.jpg">
    </a>

    <a href="game.html?heart=2" class="photo" id="photo2">
      <img src="img/20260328_101155.jpg">
    </a>

    <a href="game.html?heart=3" class="photo" id="photo3">
      <img src="img/IMG-20260328-WA0017.jpg">
    </a>

    <div class="final-section">

      <img src="img/IMG-20260428-WA0042.jpg"
           class="final-photo"
           id="finalPhoto">

      <div class="hearts">
        <span id="c1">🤍</span>
        <span id="c2">🤍</span>
        <span id="c3">🤍</span>
      </div>

    </div>

  </div>

  <script>

    const nav =
  performance.getEntriesByType("navigation")[0];

if (nav && nav.type === "reload") {
  sessionStorage.clear();
}
    
    function update(){

      const h1 = sessionStorage.getItem("heart_1");
      const h2 = sessionStorage.getItem("heart_2");
      const h3 = sessionStorage.getItem("heart_3");

      const c1 = document.getElementById("c1");
      const c2 = document.getElementById("c2");
      const c3 = document.getElementById("c3");

      const p1 = document.querySelector("#photo1 img");
      const p2 = document.querySelector("#photo2 img");
      const p3 = document.querySelector("#photo3 img");

      const finalPhoto = document.getElementById("finalPhoto");

      if(h1 === "true"){
        c1.innerHTML = "❤️";
        p1.style.filter = "grayscale(0%)";
      }

      if(h2 === "true"){
        c2.innerHTML = "❤️";
        p2.style.filter = "grayscale(0%)";
      }

      if(h3 === "true"){
        c3.innerHTML = "❤️";
        p3.style.filter = "grayscale(0%)";
      }

      if(h1 === "true" && h2 === "true" && h3 === "true"){
        finalPhoto.style.filter = "grayscale(0%)";
        finalPhoto.style.opacity = "1";
        finalPhoto.style.cursor = "pointer";

        finalPhoto.onclick = () => {
          window.location.href = "final.html";
        };
      }
    }

    update();
    window.addEventListener("pageshow", update);
    window.addEventListener("focus", update);
  </script>

</body>
</html>
