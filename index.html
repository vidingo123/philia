<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Memórias</title>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="timeline">

    <a href="game.html?heart=1"
   class="photo"
   id="photo1">

  <img src="SUA_FOTO_1.jpg">

</a>

<a href="game.html?heart=2"
   class="photo"
   id="photo2">

  <img src="SUA_FOTO_2.jpg">

</a>

<a href="game.html?heart=3"
   class="photo"
   id="photo3">

  <img src="SUA_FOTO_3.jpg">

</a>

    <div class="final-section">

      <img src="img/IMG-20260428-WA0042.jpg"
           class="final-photo"
           id="finalPhoto">

      <div class="hearts">

        <span id="c1">🤍</span>

        <span id="c2">🤍</span>

        <span id="c3">🤍</span>

      </div>

    </div>

  </div>

  <script>

    /* CARREGAR */

    const h1 = localStorage.getItem("heart1");
    const h2 = localStorage.getItem("heart2");
    const h3 = localStorage.getItem("heart3");

    /* CORAÇÕES */

    if(h1){
      document.getElementById("c1").innerHTML = "❤️";
    }

    if(h2){
      document.getElementById("c2").innerHTML = "❤️";
    }

    if(h3){
      document.getElementById("c3").innerHTML = "❤️";
    }

    /* FOTO FINAL */

    const finalPhoto =
      document.getElementById("finalPhoto");

    if(h1 && h2 && h3){

      finalPhoto.style.filter = "grayscale(0%)";

      finalPhoto.style.opacity = "1";

      finalPhoto.style.cursor = "pointer";

      finalPhoto.onclick = () => {

        window.location.href = "final.html";

      };

    }

  </script>

</body>
</html>
